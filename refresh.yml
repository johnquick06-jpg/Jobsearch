name: Refresh jobs

on:
  schedule:
    - cron: "0 14 * * *"   # every day at 14:00 UTC (7am Pacific)
  workflow_dispatch:        # lets you press "Run workflow" manually

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and score jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python fetch_jobs.py
      - name: Save results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --staged --quiet || git commit -m "Update jobs"
          git push
